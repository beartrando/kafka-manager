allowBuilds:
  "@shared/logger@git+https://github.com/beartrando/logger.git": true

# В монорепе lenvora @shared/* резолвятся как workspace-модули
# (см. корневой pnpm-workspace.yaml) — здесь fallback для установки
# пакета отдельно от монорепы.
overrides:
  "@shared/logger": "git+https://github.com/beartrando/logger.git#v1.0.0"
